<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="CONTAINER">
        <div class="loginpg">
        <div id="login">
            <div id="topic">LOGIN</div>
            <div class="INPUT">
                <input type="text" placeholder="username" id="user" required>

            </div>
            <div class="INPUT">
                <input type="password" placeholder="password" id="key"   required>
                
            </div>
            <div class="rem-forget">
                <div class="remember"><input type="checkbox" value="Remember Me"><span>Remember Me</span></div>
                <div class="forgot"><a href="#" id="forget">Forget Password</a>  </div>
            </div>
            <div class="register"><span>Don't have a account? <a href="index.html" ID="sign">SIGN UP</a>  </span></div>
            <div id="btn"><input  id="bttn"type="submit" onclick="loginfn()" value="login"></div>
</div>
        </div>
    </div>
    
</body>

</html>
